<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#fff; color:#202124; display:flex; align-items:center; justify-content:center; padding:20px; }
  .wrap { max-width:600px; width:100%; }
  .icon { font-size:52px; color:#5f6368; margin-bottom:24px; display:flex; align-items:center; gap:12px; }
  .icon svg { width:52px; height:52px; }
  h1 { font-size:22px; font-weight:400; margin-bottom:16px; color:#202124; }
  .err-code { font-family:"Courier New",monospace; font-size:14px; color:#5f6368; margin-bottom:20px; padding:12px 16px; background:#f8f9fa; border-left:3px solid #dadce0; border-radius:3px; }
  p { color:#5f6368; line-height:1.6; margin-bottom:10px; font-size:14px; }
  ul { color:#5f6368; font-size:14px; line-height:1.8; margin:10px 0 20px 20px; }
  a { color:#1a73e8; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .btn { display:inline-block; margin-top:16px; padding:10px 22px; background:#1a73e8; color:#fff; border-radius:4px; font-size:14px; font-weight:500; text-decoration:none; }
  .btn:hover { background:#1765cc; text-decoration:none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <line x1="8" y1="8" x2="16" y2="16"/>
        <line x1="16" y1="8" x2="8" y2="16"/>
      </svg>
    </div>
    <h1>This page isn’t working</h1>
    <div class="err-code">HTTP ERROR 404</div>
    <p>The requested resource could not be found on this server. It may have been removed, had its name changed, or is temporarily unavailable.</p>
    <ul>
      <li>Check the URL for typos</li>
      <li>Go back to the previous page</li>
      <li>Contact the site administrator</li>
    </ul>
    <a class="btn" href="./index.html">Go to Homepage</a>
  </div>
</body>
</html>
